<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gaming Clock</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="clock">
    <span id="hours">00</span>
    <span class="colon">:</span>

  </div>

  <script src="script.js"></script>

</body>
</html>
