<body>

  <h1 class="username">Naman Sharma</h1>

  <div class="clock">

    <div class="segment">
      <div class="digit-wrap" id="hours-wrap">
        <div class="digit" id="hours">00</div>
        <div class="digit ghost" id="hours-ghost">00</div>
      </div>
      <label>Hours</label>
    </div>

    <div class="separator">:</div>

    <div class="segment">
      <div class="digit-wrap" id="minutes-wrap">
        <div class="digit" id="minutes">00</div>
        <div class="digit ghost" id="minutes-ghost">00</div>
      </div>
      <label>Minutes</label>
    </div>

    <div class="separator">:</div>

    <div class="segment">
      <div class="digit-wrap" id="seconds-wrap">
        <div class="digit" id="seconds">00</div>
        <div class="digit ghost" id="seconds-ghost">00</div>
      </div>
      <label>Seconds</label>
    </div>

  </div>

  <script src="script.js" defer></script>

</body>
