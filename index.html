<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gaming Clock</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="clock">

    <div class="time-box">
      <span id="hours">00</span>
      <small>Hours</small>
    </div>

    <span class="colon">:</span>

    <div class="time-box">
      <span id="minutes">00</span>
      <small>Minutes</small>
    </div>

    <span class="colon">:</span>

    <div class="time-box">
      <span id="seconds">00</span>
      <small>Seconds</small>
    </div>

    <span id="ampm" class="ampm">AM</span>

  </div>

  <script src="script.js"></script>

</body>
</html>
